# Configuración del gate para el propio kit (autoverificación).

[proyecto]
nombre = "qgate"
src = ["src/qgate"]
pruebas = "tests"
app_module = ""
# Los ejemplos tienen su propio qgate.toml y se verifican por separado.
excluir = ["examples/**"]

[entorno]
# El kit soporta Python >= 3.10: se tipa y se analiza contra la mínima soportada.
python_objetivo = "3.10"
python_ejecutable = ""
# DECISIÓN DELIBERADA: el kit es una librería multiversión (Python 3.10–3.12+). ruff, mypy y
# vermin validan siempre contra la mínima soportada (3.10), pero la matriz de CI ejecuta el
# gate con 3.10 y con 3.12. Con estricto_version = true el job 3.12 fallaría por diseño, así que
# la desalineación del intérprete solo avisa (WARN), también con --ci. Los proyectos de
# aplicación (dashboards) deben usar estricto_version = true. Cubierto por
# tests/test_v011.py::test_kit_config_warns_in_ci_by_design.
estricto_version = false

[checks]
perfil = "strict"
# Sin desactivaciones: los checks de app (fastapi_config y los de nivel full) detectan que el
# kit no es una aplicación FastAPI y devuelven INFO "sin elementos que verificar".

[perfiles.strict]
# Regla del propio kit: ningún .py supera 400 líneas.
archivo_lineas_max = 400
archivo_lineas_aviso = 350

[cobertura]
criticos = ["src/qgate/exceptions_registry.py", "src/qgate/pyversion.py", "src/qgate/tools.py"]

[dependencias]
archivos = ["requirements-dev.lock"]
# El lock ya contiene el árbol completo (pip freeze): no hace falta resolver.
auditar_transitivas = false

[licencias]
# Dependencias de runtime del kit: ninguna (solo stdlib; tomli en Python 3.10).
archivos = []

[secretos]
# Fixtures deliberadamente inseguros (incluye un token FALSO): excluidos del escaneo del kit.
excluir = ["examples/vulnerable_fixtures/**"]
